    .speech-bubble::before { content: ""; position: absolute; bottom: -26px; left: 47px; border-width: 24px 24px 0 0; border-style: solid; border-color: var(--black) transparent transparent transparent; display: block; width: 0; }

    .faq-item { background: var(--cyan); border: 4px solid var(--black); padding: 20px; box-shadow: 6px 6px 0 var(--black); transform: rotate(-1deg); }

    .faq-item p { font-family: sans-serif; font-weight: bold; }
